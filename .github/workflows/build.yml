name: Build

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build (plateau, strata, all)'
        required: false
        default: 'all'
        type: choice
        options: [all, plateau, strata]
      variant:
        description: 'Variant to build (default, gaming)'
        required: false
        default: 'default'
        type: choice
        options: [default, gaming]
      arch:
        description: 'Architecture to build'
        required: false
        default: 'x86_64'
        type: choice
        options: [x86_64, x86_64_v3]

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: huntedraven7

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            plateau:
              - 'elements/plateau/**'
              - 'files/**'
              - 'include/**'
              - 'Justfile'
              - 'project.conf'
              - 'Containerfile'
            strata:
              - 'elements/strata/**'
              - 'files/**'
              - 'include/**'
              - 'Justfile'
              - 'project.conf'
              - 'Containerfile'
            core:
              - 'elements/core/**'
              - 'elements/oci/**'
              - 'elements/plugins/**'
              - 'plugins/**'
              - 'include/**'
              - 'Justfile'
              - 'project.conf'
            nvidia:
              - 'elements/bluefin-nvidia/**'

      - name: Set matrix
        id: set-matrix
        run: |
          # Determine which images to build based on workflow dispatch or changed paths
          IMAGES=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.image }}" in
              all) IMAGES="plateau strata" ;;
              plateau) IMAGES="plateau" ;;
              strata) IMAGES="strata" ;;
            esac
          else
            # Auto-detect from changed paths
            IMAGES=""
            if [ "${{ steps.filter.outputs.plateau }}" = "true" ] || [ "${{ steps.filter.outputs.core }}" = "true" ]; then
              IMAGES="$IMAGES plateau"
            fi
            if [ "${{ steps.filter.outputs.strata }}" = "true" ] || [ "${{ steps.filter.outputs.core }}" = "true" ]; then
              IMAGES="$IMAGES strata"
            fi
            # If no specific changes, build all on main/testing push
            if [ -z "$IMAGES" ] && [ "${{ github.event_name }}" = "push" ]; then
              IMAGES="plateau strata"
            fi
          fi

          # Determine variants
          VARIANTS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.variant }}" in
              default) VARIANTS="default" ;;
              gaming) VARIANTS="gaming" ;;
            esac
          else
            VARIANTS="default"
            if [ "${{ steps.filter.outputs.nvidia }}" = "true" ]; then
              VARIANTS="gaming"
            fi
          fi

          # Determine archs
          ARCHS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARCHS="${{ github.event.inputs.arch }}"
          else
            ARCHS="x86_64 x86_64_v3"
          fi

          # Build matrix JSON using jq to ensure proper escaping
          MATRIX='{"include":[]}'
          for image in $IMAGES; do
            for variant in $VARIANTS; do
              # Strata doesn't have gaming variant
              if [ "$image" = "strata" ] && [ "$variant" = "gaming" ]; then
                continue
              fi
              for arch in $ARCHS; do
                MATRIX=$(echo "$MATRIX" | jq --arg img "$image" --arg var "$variant" --arg arch "$arch" '.include += [{"image": $img, "variant": $var, "arch": $arch}]')
              done
            done
          done

          # Escape for GITHUB_OUTPUT
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$MATRIX" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.image }}-${{ matrix.variant }}-${{ matrix.arch }}
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          install-tools: '["just", "cosign", "oras", "skopeo"]'

      - name: Restore DNF cache
        uses: projectbluefin/actions/bootc-build/dnf-cache@v1
        with:
          action: restore
          cache-name: terrace-${{ matrix.image }}-${{ matrix.arch }}-${{ matrix.variant }}

      - name: Build image
        run: |
          just bst build elements/${{ matrix.image }}/${{ matrix.image }}.bst \
            --option arch ${{ matrix.arch }} \
            --option gaming ${{ matrix.variant == 'gaming' && 'true' || 'false' }} \
            --option x86_64_v3 ${{ matrix.arch == 'x86_64_v3' && 'true' || 'false' }}

      - name: Save DNF cache
        uses: projectbluefin/actions/bootc-build/dnf-cache@v1
        with:
          action: save
          cache-name: terrace-${{ matrix.image }}-${{ matrix.arch }}-${{ matrix.variant }}

      - name: Generate tags
        id: tags
        uses: projectbluefin/actions/bootc-build/generate-tags@v1
        with:
          image: ${{ matrix.image }}
          stream: ${{ github.ref_name == 'main' && 'stable' || 'testing' }}
          version: 26.08.1

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/push-image@v1
        with:
          image: ${{ steps.tags.outputs.image }}
          tags: ${{ steps.tags.outputs.tags }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        if: github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/create-manifest@v1
        with:
          image: ${{ steps.tags.outputs.image }}
          tags: ${{ steps.tags.outputs.tags }}
          registry: ${{ env.REGISTRY }}

      - name: Sign and publish
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: projectbluefin/actions/bootc-build/sign-and-publish@v1
        with:
          image: ${{ steps.tags.outputs.image }}
          tags: ${{ steps.tags.outputs.tags }}
          registry: ${{ env.REGISTRY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}

      - name: Chunkah rechunking
        if: github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/chunka@v1
        with:
          image: ${{ steps.tags.outputs.image }}
          tags: ${{ steps.tags.outputs.tags }}
          registry: ${{ env.REGISTRY }}

      - name: Scan image
        if: github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/scan-image@v1
        with:
          image: ${{ steps.tags.outputs.image }}
          tags: ${{ steps.tags.outputs.tags }}
          registry: ${{ env.REGISTRY }}
          severity: HIGH,CRITICAL

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.image }}-${{ matrix.arch }}-${{ matrix.variant }}
          path: |
            dist/
          retention-days: 7