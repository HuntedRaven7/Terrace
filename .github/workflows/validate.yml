name: Validate

on:
  pull_request:
    branches: [main, testing]
  push:
    branches: [main, testing]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          install-tools: '["just"]'

      - name: Validate BST project
        run: |
          just validate

      - name: Check release version
        run: |
          python3 .github/scripts/check-release-version.py

      - name: Check documentation
        run: |
          python3 .github/scripts/docs-checks.py

      - name: Shellcheck
        run: |
          find . -name "*.sh" -type f ! -path "./.git/*" ! -path "./build/*" ! -path "./dist/*" | xargs shellcheck -x

      - name: Hadolint
        run: |
          find . -name "Containerfile" -o -name "Dockerfile" | xargs hadolint

      - name: Pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Validate Justfile
        run: |
          just --list

      - name: Validate BST syntax
        run: |
          just bst show --deps all elements/plateau/plateau.bst
          just bst show --deps all elements/strata/strata.bst

  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-24.04
    steps:
      - name: Validate PR title
        uses: projectbluefin/actions/.github/actions/validate-pr-title@v1